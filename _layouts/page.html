---
layout: default
---
{% assign locale = site.data.i18n[page.lang] | default: site.data.i18n[site.lang] %}

<section class="page-intro reveal">
  <div class="container narrow">
    <p class="eyebrow">{{ locale.labels.subpage }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.lead %}
      <p class="lead">{{ page.lead }}</p>
    {% endif %}
  </div>
</section>

<section class="page-content">
  <div class="container narrow">
    {{ content }}
  </div>
</section>
